[project]
name = "pocketpledge-backend"
version = "0.1.0"
description = "PocketPledge backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy==2.0.30",
    "pydantic==2.7.4",
    "httpx>=0.28.1",
    "openai>=1.30.0",
    "dashscope>=1.24.2",
    "edge-tts>=6.1.12",
    "numpy>=1.26.4",
    "onnxruntime>=1.20.1",
    "sherpa-onnx>=1.10.39",
    "pillow>=10.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false
