app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: 视觉判定-黑脑
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.31@638e473191f93192f670875b06edf0bcb89a3433aa736be89ed1749073b8a168
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: current_task
          max_length: 500
          options: []
          required: false
          type: text-input
          variable: current_task
        - allowed_file_extensions:
          - .JPG
          - .JPEG
          - .PNG
          - .GIF
          - .WEBP
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: images
          max_count: 5
          required: true
          type: file-list
          variable: images
      height: 135
      id: start
      position:
        x: 149
        y: 257
      positionAbsolute:
        x: 149
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: qwen3.5-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: black-brain-system
          role: system
          text: "你是一个严格、冷静、无情绪的监督判定器。\n你会收到一张监控截图（通过视觉输入），以及用户当前的学习任务信息。\n下面是监控截图：\n\
            {{#start.images#}}\n\n目标：判断截图是否足以说明用户正在明显偏离学习任务。\n\n判定重点：\n1. 用户是否在看手机、娱乐视频、游戏、社交媒体。\n\
            2. 用户视线是否明显没有面对学习材料或屏幕。\n3. 如果证据不足，宁可保守，输出 false。\n4. 不做情绪安慰，不做道德评价，只输出结构化结论。\n\
            \n用户当前学习任务：{{#start.current_task#}}\n\n输出必须是 JSON，且严格符合：\n{\n  \"is_distracted\"\
            : true 或 false,\n  \"confidence\": 0 到 1 之间的数字,\n  \"reason\": \"英文短句描述判定理由\"\
            \n}\n\n额外要求：\n- 不要输出 markdown。\n- 不要输出解释文字。\n- 如果图片无法判断，也输出合法 JSON，并将\
            \ confidence 调低。\n"
        selected: true
        structured_output:
          schema:
            properties:
              confidence:
                description: 置信度 0-1
                type: number
              is_distracted:
                description: 是否走神
                type: boolean
              reason:
                description: 判定理由
                type: string
            required:
            - is_distracted
            - confidence
            - reason
            type: object
        structured_output_enabled: true
        title: LLM
        type: llm
        vision:
          configs:
            detail: high
            variable_selector:
            - start
            - images
          enabled: true
      height: 88
      id: llm
      position:
        x: 451
        y: 257
      positionAbsolute:
        x: 451
        y: 257
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - llm
          - structured_output
          - is_distracted
          value_type: object
          variable: is_distracted
        - value_selector:
          - llm
          - structured_output
          - confidence
          value_type: object
          variable: confidence
        - value_selector:
          - llm
          - structured_output
          - reason
          value_type: object
          variable: reason
        selected: false
        title: 输出
        type: end
      height: 140
      id: end
      position:
        x: 753
        y: 257
      positionAbsolute:
        x: 753
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: -205.31920583527278
      y: -320.2199156250498
      zoom: 1.0028260121874002
  rag_pipeline_variables: []
