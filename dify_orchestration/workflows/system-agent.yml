      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    - data:
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-source-llm-target
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: user_text
          max_length: 4000
          options: []
          required: true
          type: text-input
          variable: user_text
        - label: chat_history
          max_length: 10000
          options: []
          required: false
          type: paragraph
          variable: chat_history
        - label: supervision_state
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: supervision_state
        - label: current_task
          max_length: 500
          options: []
          required: false
          type: text-input
          variable: current_task
        - label: total_focus_seconds
          required: false
          type: number
          variable: total_focus_seconds
        - label: focus_time_remaining
          required: false
          type: number
          variable: focus_time_remaining
        - label: suggested_focus_seconds
          required: false
          type: number
          variable: suggested_focus_seconds
        - label: pause_remaining_seconds
          required: false
          type: number
          variable: pause_remaining_seconds
        - label: pause_requests_count
          required: false
          type: number
          variable: pause_requests_count
        - label: is_bankrupt
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: is_bankrupt
      height: 343
      id: start
      position:
        x: 80
        y: 250
      positionAbsolute:
        x: 80
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            enable_search: true
            enable_thinking: true
            temperature: 0.1
          mode: chat
          name: qwen3.5-plus
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: system-agent-system
          role: system
          text: "你是 Study Buddy 的系统 Agent。你的职责是把用户的请求翻译成结构化编排决策，而不是陪聊。\n\n═══ 输入上下文\
            \ ═══\n- user_text: {{#start.user_text#}}\n- chat_history（近期对话记录）: {{#start.chat_history#}}\n\
            - supervision_state: {{#start.supervision_state#}}（setup / active / paused\
            \ / completed）\n- current_task: {{#start.current_task#}}\n- total_focus_seconds:\
            \ {{#start.total_focus_seconds#}}\n- focus_time_remaining: {{#start.focus_time_remaining#}}\n\
            - suggested_focus_seconds: {{#start.suggested_focus_seconds#}}\n- pause_remaining_seconds:\
            \ {{#start.pause_remaining_seconds#}}\n- pause_requests_count: {{#start.pause_requests_count#}}\n\
            - is_bankrupt: {{#start.is_bankrupt#}}\n\n知识检索结果中可能包含用户画像、历史行为数据等参考信息。请结合这些信息做出更合理的判定。\n\
            \n═══ 输出规则 ═══\n你必须且只能输出一个 JSON 对象，不要输出任何解释文字。\n\nJSON 结构：\n{\n  \"action\"\
            : \"none\" | \"plan\" | \"start\" | \"pause\" | \"resume\" | \"complete\"\
            ,\n  \"approved\": true | false,\n  \"duration_seconds\": number | null,\n\
            \  \"pause_seconds\": number | null,\n  \"requires_capture\": true | false,\n\
            \  \"capture_sources\": [\"screen\"] 和/或 [\"camera\"] 的子集,\n  \"system_events\"\
            : [string, ...],\n  \"plan\": null 或 {\n    \"tasks\": [{\"id\": \"t1\"\
            , \"title\": string, \"completed\": false, \"estimatedMinutes\": number}],\n\
            \    \"totalMinutes\": number,\n    \"suggestedDuration\": number\n  }\n\
            }\n\n═══ 判定规则 ═══\n\n1. 识别意图：结合 user_text 和 chat_history 判断用户真正想做什么。\n\
            \   chat_history 提供了对话上下文，帮你理解\"这件事\"具体指什么。\n\n2. 视觉请求：当用户说\"看看桌面/屏幕/摄像头/画面/帮我看看\"\
            时：\n   - requires_capture = true\n   - 只看桌面 → [\"screen\"]；只看摄像头 → [\"\
            camera\"]；不确定 → [\"screen\", \"camera\"]\n   - action = \"none\"（纯视觉请求不附带其他操作）\n\
            \n3. 开始监督：当用户明确要开始学习/进入监督时：\n   - action = \"start\"\n   - 如文本提到时长，填 duration_seconds（秒）\n\
            \   - 否则优先用 suggested_focus_seconds，没有则 1500\n\n4. 制定计划：当用户讨论计划或安排任务时：\n\
            \   - action = \"plan\"\n   - 生成结构化 plan，标题简洁\n   - suggestedDuration\
            \ 单位为秒\n\n5. 暂停请求：当用户要暂停时：\n   - action = \"pause\"\n   - 合理需求（厕所、喝水、身体不适）→\
            \ approved = true，pause_seconds = 合理时长（180~600秒）\n   - 不合理（刚开始不到5分钟且已多次暂停）→\
            \ approved = false\n   - 参考 pause_requests_count 和 focus_time_remaining\
            \ 判断\n\n6. 恢复：用户说继续/恢复 → action = \"resume\"\n\n7. 结束：用户说结束/不学了 → action\
            \ = \"complete\"\n\n8. 普通闲聊：无工具需求 → action = \"none\"，所有可选字段设为 null/空\n\
            \n═══ system_events 格式 ═══\n给白脑的事件通知，格式如：\n- \"[SYSTEM_RESULT: PAUSE_APPROVED,\
            \ MINUTES: 5]\"\n- \"[SYSTEM_RESULT: PAUSE_REJECTED, REASON: 才开始5分钟就要休息]\"\
            \n- \"[SYSTEM_RESULT: SESSION_STARTED, MINUTES: 25, COST: 375]\"\n- \"\
            [SYSTEM_RESULT: PLAN_UPDATED, TITLE: 数学, TOTAL_MINUTES: 30]\"\n- \"[SYSTEM_RESULT:\
            \ SESSION_COMPLETED]\"\n- \"[SYSTEM_RESULT: VISUAL_CONTEXT_REQUESTED,\
            \ SOURCES: screen,camera]\"\n- \"[SYSTEM_RESULT: RESUME_APPROVED]\"\n\n\
            ═══ 额外约束 ═══\n- 不要为同一轮输出互相冲突的 action。\n- requires_capture 为 true 时，action\
            \ 应为 \"none\"。\n- action = \"none\" 且 requires_capture = false 时，duration_seconds\
            \ 和 pause_seconds 设为 null。\n- capture_sources 只能包含 \"screen\" 和 \"camera\"\
            。\n"
        reasoning_format: separated
        selected: true
        structured_output:
          schema:
            properties:
              action:
                enum:
                - none
                - plan
                - start
                - pause
                - resume
                - complete
                type: string
              approved:
                type: boolean
              capture_sources:
                items:
                  enum:
                  - screen
                  - camera
                  type: string
                type: array
              duration_seconds:
                nullable: true
                type: number
              pause_seconds:
                nullable: true
                type: number
              plan:
                nullable: true
                properties:
                  suggestedDuration:
                    type: number
                  tasks:
                    items:
                      properties:
                        completed:
                          type: boolean
                        estimatedMinutes:
                          type: number
                        id:
                          type: string
                        title:
                          type: string
                      required:
                      - id
                      - title
                      - completed
                      - estimatedMinutes
                      type: object
                    type: array
                  totalMinutes:
                    type: number
                required:
                - tasks
                - totalMinutes
                - suggestedDuration
                type: object
              requires_capture:
                type: boolean
              system_events:
                items:
                  type: string
                type: array
            required:
            - action
            - approved
            - duration_seconds
            - pause_seconds
            - requires_capture
            - capture_sources
            - system_events
            - plan
            type: object
        structured_output_enabled: true
        title: LLM
        type: llm
        vision:
          configs:
            detail: high
            variable_selector:
            - sys
            - files
          enabled: true
      height: 88
      id: llm
      position:
        x: 550
        y: 250
      positionAbsolute:
        x: 550
        y: 250
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
