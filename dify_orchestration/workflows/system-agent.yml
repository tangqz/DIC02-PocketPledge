          - structured_output
          - approved
          value_type: boolean
          variable: approved
        - value_selector:
          - llm
          - structured_output
          - duration_seconds
          value_type: number
          variable: duration_seconds
        - value_selector:
          - llm
          - structured_output
          - pause_seconds
          value_type: number
          variable: pause_seconds
        - value_selector:
          - llm
          - structured_output
          - requires_capture
          value_type: boolean
          variable: requires_capture
        - value_selector:
          - llm
          - structured_output
          - capture_sources
          value_type: array[string]
          variable: capture_sources
        - value_selector:
          - llm
          - structured_output
          - system_events
          value_type: array[string]
          variable: system_events
        - value_selector:
          - llm
          - structured_output
          - plan
          value_type: object
          variable: plan
        selected: false
        title: 输出
        type: end
      height: 270
      id: end
      position:
        x: 850
        y: 250
      positionAbsolute:
        x: 850
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: -14
      y: -10
      zoom: 0.82
  rag_pipeline_variables: []
