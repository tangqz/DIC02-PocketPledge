app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: 视觉判定-黑脑
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/gemini:0.7.14@f0200773cd6025864b2215dfe4a353eaf23f9635e9b6098ae0d9f2cb41fc5df4
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: current_task
          max_length: 500
          options: []
          required: false
          type: text-input
          variable: current_task
        - label: images
          required: true
          type: file-list
          variable: images
          allowed_file_extensions:
          - .JPG
          - .JPEG
          - .PNG
          - .GIF
          - .WEBP
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          - remote_url
          max_count: 5
      height: 100
      id: start
      position:
        x: 149
        y: 257
      positionAbsolute:
        x: 149
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: gemini-2.5-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: black-brain-system
          role: system
          text: |
            你是一个严格、冷静、无情绪的监督判定器。
            你会收到一张监控截图（通过视觉输入），以及用户当前的学习任务信息。

            目标：判断截图是否足以说明用户正在明显偏离学习任务。

            判定重点：
            1. 用户是否在看手机、娱乐视频、游戏、社交媒体。
            2. 用户视线是否明显没有面对学习材料或屏幕。
            3. 如果证据不足，宁可保守，输出 false。
            4. 不做情绪安慰，不做道德评价，只输出结构化结论。

            用户当前学习任务：{{#start.current_task#}}

            输出必须是 JSON，且严格符合：
            {
              "is_distracted": true 或 false,
              "confidence": 0 到 1 之间的数字,
              "reason": "英文短句描述判定理由"
            }

            额外要求：
            - 不要输出 markdown。
            - 不要输出解释文字。
            - 如果图片无法判断，也输出合法 JSON，并将 confidence 调低。
        selected: false
        structured_output:
          schema:
            properties:
              confidence:
                description: 置信度 0-1
                type: number
              is_distracted:
                description: 是否走神
                type: boolean
              reason:
                description: 判定理由
                type: string
            required:
            - is_distracted
            - confidence
            - reason
            type: object
        structured_output_enabled: true
        title: LLM
        type: llm
        vision:
          enabled: true
          configs:
            detail: low
            variable_selector:
            - start
            - images
      height: 88
      id: llm
      position:
        x: 451
        y: 257
      positionAbsolute:
        x: 451
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - llm
          - structured_output
          - is_distracted
          value_type: object
          variable: is_distracted
        - value_selector:
          - llm
          - structured_output
          - confidence
          value_type: object
          variable: confidence
        - value_selector:
          - llm
          - structured_output
          - reason
          value_type: object
          variable: reason
        selected: false
        title: 输出
        type: end
      height: 140
      id: end
      position:
        x: 753
        y: 257
      positionAbsolute:
        x: 753
        y: 257
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: -8.28
      y: -24.68
      zoom: 0.76
  rag_pipeline_variables: []
